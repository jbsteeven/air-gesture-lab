name: SDK Contract Tests

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'package.json'
      - 'app.js'
      - 'air-gaze-fusion.js'
      - 'air-gesture-sdk.js'
      - 'air-gesture-vocabulary.js'
      - '.github/workflows/sdk-contract.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'package.json'
      - 'app.js'
      - 'air-gaze-fusion.js'
      - 'air-gesture-sdk.js'
      - 'air-gesture-vocabulary.js'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
